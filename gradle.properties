org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# RetroFuturaGradle 2.0.3 is published as Java 25 bytecode, so the Gradle JVM
# itself must be JDK 25 (or newer). Mod sources are still compiled for Java 8
# through the toolchain below. If JAVA_HOME points elsewhere, override it, e.g.
#   $env:JAVA_HOME='C:\Program Files\Java\jdk-25'; .\gradlew build
# See docs/MILESTONES.md for the verified environment.

# Mod identity: fixed, do not change (see docs/PORTING-1.12.2.md, decision D1).
mod_id=integratedscriptingcallback
mod_name=Integrated-Scripting-Callback
mod_version=1.0
mod_group=com.mpp

# Minecraft / Forge / MCP
mc_version=1.12.2
mapping_channel=snapshot
mapping_version=20171003

# Script runtime: GraalVM JS 21.3.0 is the last release that targets Java 8.
graal_version=21.3.0

mixinbooter_version=11.18
mixin_config=integratedscriptingcallback.mixins.json
